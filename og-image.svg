<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#24242b"/>
      <stop offset="100%" stop-color="#1a1a1f"/>
    </linearGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b4c30"/>
      <stop offset="100%" stop-color="#4a3020"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle accent stripe bottom -->
  <rect x="0" y="620" width="1200" height="10" fill="#d4956b" opacity="0.4"/>

  <!-- ═══ Left: Pawn ═══ -->
  <g transform="translate(60, 110) scale(1.1)">
    <!-- Body -->
    <path d="M 226 150 C 226 130, 290 130, 290 150 L 300 260 C 300 290, 280 310, 256 310 C 232 310, 212 290, 212 260 Z" fill="#f0c8a0" stroke="#d4a878" stroke-width="2"/>
    <!-- Head -->
    <circle cx="258" cy="140" r="36" fill="#f0c8a0" stroke="#d4a878" stroke-width="2"/>
    <!-- Hat -->
    <ellipse cx="258" cy="106" rx="68" ry="14" fill="url(#hat)"/>
    <path d="M 224 106 C 224 70, 230 58, 258 56 C 286 58, 292 70, 292 106 Z" fill="url(#hat)"/>
    <path d="M 225 100 Q 258 104 291 100 L 292 106 Q 258 110 224 106 Z" fill="#8b6914"/>
  </g>

  <!-- ═══ Right: Text ═══ -->
  <text x="740" y="240" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="64" font-weight="700" fill="#ffffff" letter-spacing="2">RimWorld Guide</text>

  <!-- Accent divider -->
  <line x1="620" y1="280" x2="860" y2="280" stroke="#d4956b" stroke-width="3" opacity="0.8"/>

  <text x="740" y="340" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" fill="#888896" letter-spacing="3">FROM SURVIVING TO THRIVING</text>

  <text x="740" y="400" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" fill="#888896" letter-spacing="2">yxhtl.com — Complete RimWorld strategy guides</text>
</svg>
