<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>导出PNG</title>
<style>
  body { background:#1a1a1f; display:flex; flex-direction:column; align-items:center; padding:40px; font-family: sans-serif; gap:40px; }
  .card { background:#24242b; padding:24px; border-radius:12px; text-align:center; }
  svg { border-radius:8px; }
  button { margin-top:16px; padding:12px 36px; font-size:16px; background:#d4956b; color:#1a1a1f; border:none; border-radius:8px; cursor:pointer; font-weight:bold; }
  button:hover { background:#e8a87c; }
  p { color:#888; margin-top:8px; font-size:13px; }
  h3 { color:#fff; margin-bottom:12px; }
</style></head>
<body>

<div class="card">
  <h3>品牌图片 (512×512) — Steam Guide / Logo</h3>
  <svg id="brand" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="256" height="256">
    <defs>
      <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#24242b"/><stop offset="100%" stop-color="#1a1a1f"/></linearGradient>
      <linearGradient id="hat1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#6b4c30"/><stop offset="100%" stop-color="#4a3020"/></linearGradient>
    </defs>
    <rect width="512" height="512" rx="24" fill="url(#bg1)"/>
    <rect width="512" height="512" rx="24" fill="none" stroke="#333340" stroke-width="2"/>
    <path d="M 226 150 C 226 130, 290 130, 290 150 L 300 260 C 300 290, 280 310, 256 310 C 232 310, 212 290, 212 260 Z" fill="#f0c8a0" stroke="#d4a878" stroke-width="2"/>
    <circle cx="258" cy="140" r="36" fill="#f0c8a0" stroke="#d4a878" stroke-width="2"/>
    <ellipse cx="258" cy="106" rx="68" ry="14" fill="url(#hat1)"/>
    <path d="M 224 106 C 224 70, 230 58, 258 56 C 286 58, 292 70, 292 106 Z" fill="url(#hat1)"/>
    <path d="M 225 100 Q 258 104 291 100 L 292 106 Q 258 110 224 106 Z" fill="#8b6914"/>
    <text x="256" y="396" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="48" font-weight="700" fill="#ffffff" letter-spacing="2">RimWorld Guide</text>
    <text x="256" y="440" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#888896" letter-spacing="3">FROM SURVIVING TO THRIVING</text>
    <line x1="156" y1="466" x2="356" y2="466" stroke="#d4956b" stroke-width="2" opacity="0.6"/>
  </svg>
  <br>
  <button onclick="download('brand',512,512,'rimworld-guide-brand.png')">导出 PNG</button>
</div>

<div class="card">
  <h3>OG 图片 (1200×630) — Reddit / 社交分享预览</h3>
  <svg id="og" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="480" height="252">
    <defs>
      <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#24242b"/><stop offset="100%" stop-color="#1a1a1f"/></linearGradient>
      <linearGradient id="hat2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#6b4c30"/><stop offset="100%" stop-color="#4a3020"/></linearGradient>
    </defs>
    <rect width="1200" height="630" fill="url(#bg2)"/>
    <rect x="0" y="620" width="1200" height="10" fill="#d4956b" opacity="0.4"/>
    <g transform="translate(60, 110) scale(1.1)">
      <path d="M 226 150 C 226 130, 290 130, 290 150 L 300 260 C 300 290, 280 310, 256 310 C 232 310, 212 290, 212 260 Z" fill="#f0c8a0" stroke="#d4a878" stroke-width="2"/>
      <circle cx="258" cy="140" r="36" fill="#f0c8a0" stroke="#d4a878" stroke-width="2"/>
      <ellipse cx="258" cy="106" rx="68" ry="14" fill="url(#hat2)"/>
      <path d="M 224 106 C 224 70, 230 58, 258 56 C 286 58, 292 70, 292 106 Z" fill="url(#hat2)"/>
      <path d="M 225 100 Q 258 104 291 100 L 292 106 Q 258 110 224 106 Z" fill="#8b6914"/>
    </g>
    <text x="740" y="240" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="64" font-weight="700" fill="#ffffff" letter-spacing="2">RimWorld Guide</text>
    <line x1="620" y1="280" x2="860" y2="280" stroke="#d4956b" stroke-width="3" opacity="0.8"/>
    <text x="740" y="340" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" fill="#888896" letter-spacing="3">FROM SURVIVING TO THRIVING</text>
    <text x="740" y="400" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" fill="#888896" letter-spacing="2">yxhtl.com — Complete RimWorld strategy guides</text>
  </svg>
  <br>
  <button onclick="download('og',1200,630,'og-image.png')">导出 PNG</button>
</div>

<p>导出后把 og-image.png 放到网站根目录，跟 index.html 放一起就行。</p>

<script>
function download(id,w,h,filename){
  const svg=document.getElementById(id);
  const xml=new XMLSerializer().serializeToString(svg);
  const blob=new Blob([xml],{type:'image/svg+xml;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const img=new Image();
  img.onload=function(){
    const c=document.createElement('canvas');
    c.width=w; c.height=h;
    c.getContext('2d').drawImage(img,0,0,w,h);
    URL.revokeObjectURL(url);
    const a=document.createElement('a');
    a.download=filename;
    a.href=c.toDataURL('image/png');
    a.click();
  };
  img.src=url;
}
</script>
</body></html>
